[project]
name = "tracecontract"
version = "0.1.0"
description = "Correction-aware task contracts and reward-fidelity auditing for trace-derived coding tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
data = [
  "pyarrow>=16",
  "duckdb>=1.0",
]
dev = [
  "pytest>=8",
]

[project.scripts]
tracecontract = "tracecontract.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracecontract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "docker: requires a working local Docker daemon",
]
